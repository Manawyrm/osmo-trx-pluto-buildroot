log stderr
 logging filter all 1
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging timestamp 0
 logging print file basename last
 logging print level 1
 logging level set-all notice
! logging level dev debug
!
line vty
 no login
!
cpu-sched
 policy rr 18
trx
 bind-ip 192.168.2.1
 remote-ip 192.168.2.10
 tx-sps 4
 rx-sps 4
 egprs disable
 viterbi-eq disable
 chan 0
stats interval 10
stats reporter statsd
  remote-ip 127.0.0.1
  remote-port 9125
  level global
  no prefix
  enable
